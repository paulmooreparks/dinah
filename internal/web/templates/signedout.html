{{define "signedout.html"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signed Out · {{.Product}}</title>
<script src="/static/pudl/pudl-theme.js"></script>
<link rel="stylesheet" href="/static/pudl/pudl.css">
<link rel="stylesheet" href="/static/brand.css">
<link rel="stylesheet" href="/static/dinah.css">
</head>
<body>
<header class="topbar"><a class="brand" href="/">{{.Product}}</a></header>
<main class="dinah-main">
<div class="empty-state">
  <p class="empty-state-title">Sign In From the Command Line</p>
  <p class="empty-state-body">{{if .Error}}{{.Error}} {{end}}Run <code>{{.Command}} open</code> to sign this browser in. The page accepts no other sign-in, so no web site can reach your agents through it.</p>
</div>
</main>
</body>
</html>
{{end}}
