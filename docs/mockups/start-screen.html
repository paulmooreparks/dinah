<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start screen: mockup</title>
  <link rel="stylesheet" href="../../cmd/dinah-desktop/frontend/pudl/pudl.css">
  <link rel="stylesheet" href="../../cmd/dinah-desktop/frontend/pudl/pudl-windows.css">
  <link rel="stylesheet" href="../../cmd/dinah-desktop/frontend/app.css">
  <style>
    /* The frame and the stand-in for the application's window are the
       mockup's. The rules marked "start screen" are what the page would add. */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; display: flex; flex-direction: column; color: var(--text); background: var(--bg); font-family: var(--font); font-size: var(--text-base); }
    .mock-header { flex: none; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-4); background: var(--surface); border-bottom: 1px solid var(--border); }
    .mock-header h1 { margin: 0; font-size: var(--text-md); font-weight: 700; }
    .mock-header .mock-tag { margin-inline-start: auto; font-size: var(--text-sm); color: var(--text-muted); }
    .mock-stage { flex: 1; min-height: 0; padding: var(--space-4); display: flex; }
    /* The stand-in for the program's own window, which the start screen fills. */
    .mock-app { position: relative; flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--bg); display: flex; flex-direction: column; }
    .mock-app-bar { flex: none; height: 48px; display: flex; align-items: center; gap: var(--space-4); padding: 0 var(--space-4); background: var(--surface); border-bottom: 1px solid var(--border); font-weight: 600; font-size: var(--text-sm); }
    .mock-app-bar img { width: 20px; height: 20px; }
    .mock-app-work { flex: 1; min-height: 0; display: grid; grid-template-columns: 280px minmax(0, 1fr) 300px; }
    .mock-app-work > div { border-inline-end: 1px solid var(--border); padding: var(--space-3); color: var(--text-muted); font-size: var(--text-sm); }
    .mock-app-work > div:nth-child(2) { background: var(--surface); }
    .mock-app-foot { flex: none; height: 43px; background: var(--surface); border-top: 1px solid var(--border); }

    /* start screen: it fills the window while the program starts, in front
       of everything, and is taken away in one step when the saved layout
       has been drawn. Nothing on it can be pressed, so nothing on it is
       raised. The mark and the name are the largest things on it. */
    .start-screen { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; padding: var(--space-5); background: var(--bg); }
    .start-screen[hidden] { display: none; }
    .start-screen-body { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); text-align: center; max-width: 34rem; }
    .start-screen-logo { display: block; width: 160px; height: 160px; }
    .start-screen-name { margin: var(--space-2) 0 0; font-size: 2.75rem; line-height: 1.1; font-weight: 700; letter-spacing: -0.01em; color: var(--dinah-title, var(--text)); }
    .start-screen-about { margin: 0; color: var(--text-muted); }
    .start-screen-version { margin: 0; color: var(--text-muted); font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
    /* The line that says what is happening keeps one height and one place whatever it says. */
    .start-screen-state { margin-top: var(--space-5); width: min(20rem, 100%); display: flex; flex-direction: column; align-items: center; gap: var(--space-2); }
    .start-screen-state .progress { width: 100%; }
    .start-screen-words { margin: 0; min-height: 1.5em; font-size: var(--text-sm); color: var(--text-muted); }
    @media (max-width: 640px) { .mock-tag { display: none; } .mock-app-work { grid-template-columns: minmax(0, 1fr); } .mock-app-work > div:not(:nth-child(2)) { display: none; } .start-screen-logo { width: 112px; height: 112px; } .start-screen-name { font-size: 2rem; } }
  </style>
</head>
<body>
  <header class="mock-header">
    <h1>Start screen</h1>
    <button type="button" class="btn btn-sm" id="mock-theme">Dark Theme</button>
    <button type="button" class="btn btn-sm" id="mock-play">Play the Start</button>
    <button type="button" class="btn btn-sm" id="mock-hold">Show the Start Screen</button>
    <span class="mock-tag">Mockup, 17 November 2026. The window behind it is a stand-in.</span>
  </header>
  <main class="mock-stage">
    <section class="mock-app" aria-label="The program's window">
      <div class="mock-app-bar"><img src="../../cmd/dinah-desktop/frontend/product-mark.svg" alt=""><span>Dinah</span><span>Workspaces</span><span>Documents</span><span>View</span><span>Window</span><span>Help</span></div>
      <div class="mock-app-work"><div>Workspace</div><div>The windows, where the saved layout has them.</div><div>Chats</div></div>
      <div class="mock-app-foot"></div>

      <div class="start-screen" id="start-screen" role="status" aria-live="polite">
        <div class="start-screen-body">
          <img class="start-screen-logo" src="../../cmd/dinah-desktop/frontend/product-logo.svg" alt="">
          <h2 class="start-screen-name">Dinah</h2>
          <p class="start-screen-about">Connects your workspace and applets to supported agents.</p>
          <p class="start-screen-version">Version 0.107.0</p>
          <div class="start-screen-state">
            <progress class="progress" aria-label="Starting"></progress>
            <p class="start-screen-words" id="start-words">Starting…</p>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script>
    (function () {
      var screen = document.getElementById('start-screen'), words = document.getElementById('start-words'), timers = [];
      function clear() { timers.forEach(clearTimeout); timers = []; }
      function hold() { clear(); words.textContent = 'Starting…'; screen.hidden = false; }
      document.getElementById('mock-hold').addEventListener('click', hold);
      document.getElementById('mock-play').addEventListener('click', function () {
        hold();
        timers.push(setTimeout(function () { words.textContent = 'Opening your windows…'; }, 900));
        timers.push(setTimeout(function () { screen.hidden = true; }, 1800));
      });
      document.getElementById('mock-theme').addEventListener('click', function () {
        var dark = document.documentElement.dataset.theme !== 'dark';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        this.textContent = dark ? 'Light Theme' : 'Dark Theme';
      });
    })();
  </script>
</body>
</html>
