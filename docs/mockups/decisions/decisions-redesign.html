      var picked = document.querySelector('input[name="answer-' + q.n + '"]:checked'), text = document.getElementById('answer-' + q.n + '-text');
      d[q.n] = { choice: picked ? picked.value : '', text: text ? text.value : '' };
    });
    M.drafts[key] = d;
  }
  function typedDraft(r, prefix) {
    var id = prefix + 'answer-task';
    if (r.answer.type === 'text') { var area = document.getElementById(id + '-text'); return { text: area ? area.value : '' }; }
    return { picks: Array.from(document.querySelectorAll('input[name="' + id + '-pick"]:checked')).map(function (b) { return b.value; }) };
  }
  /* What a typed answer says in the record: the text as written, or the chosen options in
     the order the service offered them. */
  function typedRecord(r, d) {
    if (r.answer.type === 'text') return d.text ? d.text : '(an empty answer)';
    return r.answer.options.filter(function (o) { return (d.picks || []).indexOf(o.optionId) >= 0; }).map(function (o) { return o.name; }).join(', ') || '(nothing chosen)';
  }
  function send() {
    var key = M.selected, r = R[key]; if (!canSend(r)) return;
    M.phase = 'sending'; M.status = null; render();
    var token = ++M.token;
    setTimeout(function () {
      if (M.token !== token) return;
      if (M.failNext) { M.failNext = false; M.phase = 'unconfirmed'; render(); return; }
      deliver(key);
    }, 900);
  }
  function deliver(key) {
    var r = R[key], d = M.drafts[key] || {}, at = now();
    M.phase = null;
    if (r.kind === 'task') return close(key, { how: 'sent', at: at, option: r.answer ? typedRecord(r, d) : r.options[+d.task.slice(1)].name }, { tone: 'positive', glyph: 'check', text: 'Your answer was sent to ' + r.serviceName + ', which continues the task ' + r.taskTitle + '.', link: 'Show the Answer' });
    if (r.kind === 'mention') return close(key, { how: 'sent', at: at, reply: d.text.trim() }, { tone: 'positive', glyph: 'check', text: 'Your reply was sent to ' + r.asker + ' in ' + r.group + '.', link: 'Show the Reply' });
    var sent = {};
    openQs(r).forEach(function (q) { var a = answerOf(q, d[q.n]); if (a) sent[q.n] = a; });
    var nSent = Object.keys(sent).length, left = openQs(r).length - nSent;
    if (left > 0) {
      /* A partial answer keeps the request open. The answered questions show their answer and time. */
      openQs(r).forEach(function (q) { if (sent[q.n]) { q.answered = sent[q.n]; q.answeredAt = at; delete d[q.n]; } });
      M.status = { tone: 'positive', glyph: 'check', text: (nSent === 1 ? 'Your answer was' : 'Your ' + nSent + ' answers were') + ' sent to ' + where(r) + '. ' + (left === 1 ? 'The other question stays open.' : 'The other ' + left + ' stay open.') };
      return render();
    }
    var answers = {};
    r.questions.forEach(function (q) { answers[q.n] = q.answered ? { text: q.answered, at: q.answeredAt } : { text: sent[q.n], at: at }; });
    close(key, { how: 'sent', at: at, answers: answers }, { tone: 'positive', glyph: 'check', text: 'Your answers were sent to ' + r.asker + (r.group ? ' in ' + r.group : '') + '.', link: 'Show Answers' });
  }
  /* A finished request leaves the list, and the next one opens in its place. */
  function close(key, record, status) {
    M.closed[key] = record;
    var before = visible(), i = before.indexOf(key);
    M.open = M.open.filter(function (k) { return k !== key; });
    delete M.drafts[key];
    var after = visible(), next = (i >= 0 && (after[i] || after[i - 1])) || after[0] || M.open[0] || null;
    if (status.link) status.act = 'record:' + key;
    M.token++; M.phase = null; M.view = 'request';
    if (next) { M.selected = next; M.status = status; M.done = null; }
    else { M.selected = null; M.status = null; M.done = status; M.pane = 'detail'; }
    render();
    var sc = document.querySelector('.decisions-scroll'); if (sc) sc.scrollTop = 0;
  }
  function askDismiss(which) {
    var key = which || M.selected, r = R[key], isMsg = r.kind === 'mention', isTask = r.kind === 'task';
    var opener = document.activeElement;
    var told = r.gone ? 'The chat that asked was retired, so nobody can be told.' : isTask ? r.serviceName + ' is told you dismissed it, with no answer, and the task decides what happens next.' : r.asker + ' is told you dismissed it, so it does not wait for you.';
    var dlg = h('dialog', { class: 'dialog', id: 'ask', 'aria-labelledby': 'dlg-title' },
      h('h3', { class: 'dialog-title', id: 'dlg-title', text: isMsg ? 'Dismiss This Message?' : isTask ? 'Dismiss This Question?' : 'Dismiss This Request?' }),
      h('p', { class: 'dialog-body', text: (isMsg ? 'No reply is sent' : 'No answer is sent') + ', and it leaves Decisions. ' + told + ' Use this when you have dealt with it elsewhere, or it can no longer be answered.' }),
      h('form', { class: 'dialog-actions', method: 'dialog' }, h('button', { class: 'btn', value: 'cancel', text: 'Cancel' }), h('button', { class: 'btn btn-danger', value: 'yes', text: 'Dismiss' })));
    dlg.addEventListener('close', function () {
      var yes = dlg.returnValue === 'yes'; dlg.remove();
      var from = isTask ? r.serviceName : r.asker;
      if (yes) close(key, { how: 'dismissed', at: now() }, { tone: 'positive', glyph: 'check', text: (isMsg ? 'You dismissed the message from ' : isTask ? 'You dismissed the question from ' : 'You dismissed the request from ') + from + '. ' + (isMsg ? 'No reply was sent.' : 'No answer was sent.'), link: isMsg ? 'Show the Message' : isTask ? 'Show the Question' : 'Show the Request' });
      else if (opener && opener.isConnected) opener.focus();
      else { var b = document.querySelector('[data-act="dismiss"]'); if (b) b.focus(); }
    });
    document.body.append(dlg); dlg.showModal();
  }

  function act(name, el) {
    var r = R[M.selected];
    if (name === 'send') return send();
    if (name === 'about') { M.pane = 'about'; render(); var bk = document.querySelector('[data-act="about-back"]'); if (bk) bk.focus(); return; }
    if (name === 'about-back') { M.pane = 'detail'; render(); var ab = document.querySelector('[data-act="about"]'); if (ab) ab.focus(); return; }
    if (name === 'dismiss') return askDismiss();
    if (name === 'check') { M.phase = 'checking'; render(); var token = ++M.token, key = M.selected; return setTimeout(function () { if (M.token === token) deliver(key); }, 900); }
    if (name === 'ack') { r.questions.forEach(function (q) { delete q.changed; }); M.phase = null; return render(); }
    if (name === 'back') { M.view = 'request'; M.selected = M.open.filter(function (k) { return matches(R[k], M.filter); })[0] || M.open[0] || null; M.status = null; if (!M.selected) M.pane = 'detail'; return render(); }
    if (name === 'clear-filter') { M.filter = ''; return render(); }
    if (name === 'more') { M.open = M.open.concat(MORE.filter(function (k) { return M.open.indexOf(k) < 0 && !M.closed[k]; })); M.more = false; return render(); }
    if (name === 'close-note') { var reg = document.querySelector('.toast-region'); if (reg) reg.replaceChildren(); return; }
    if (name === 'fold') {
      var quote = document.querySelector('.decisions-message'), open = el.getAttribute('aria-expanded') !== 'true';
      M.expanded[M.selected] = open; quote.dataset.folded = String(!open); el.setAttribute('aria-expanded', String(open));

    if (name.indexOf('note-open:') === 0) { M.notes = false; return select(name.slice(10)); }
    if (name.indexOf('note-answer:') === 0) {
      var nk = name.slice(12), nr = R[nk], nd = M.drafts[nk] || {}; if (!readyCount(nr, nd)) return;
      return close(nk, { how: 'sent', at: now(), option: nr.answer ? typedRecord(nr, nd) : nr.options[+nd.task.slice(1)].name },
        { tone: 'positive', glyph: 'check', text: 'Your answer from Notifications was sent to ' + nr.serviceName + ', which continues the task ' + nr.taskTitle + '. It left Decisions too.', link: 'Show the Answer' });
    }
    if (name.indexOf('record:') === 0) { M.selected = name.slice(7); M.view = 'record'; M.status = null; M.pane = 'detail'; render(); var sc = document.querySelector('.decisions-scroll'); if (sc) sc.scrollTop = 0; return; }
  }

  function tryIt(what) {
    var r = R[M.selected];
    if (what === 'restart') { location.search = '?state=' + M.start + (theme === 'dark' ? '&theme=dark' : ''); return; }
    if (what === 'index') { location.search = '?state=index'; return; }
    if (what === 'theme') { theme = theme === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', theme); render(); return; }
    if (what === 'arrive' || what === 'task') {
      var pool = what === 'arrive' ? ARRIVALS : ['t112', 't113', 't106', 't107'];
      var k = pool.filter(function (x) { return M.open.indexOf(x) < 0 && !M.closed[x]; })[0];
      if (!k) return note('Every invented ' + (what === 'arrive' ? 'request' : 'task question') + ' has already arrived. Start this state again to see it once more.');
      M.open.push(k);
      if (!M.selected) { M.selected = k; M.view = 'request'; M.status = null; }
      render();
      return note((R[k].kind === 'task' ? R[k].serviceName + ' asked a question for ' + R[k].taskTitle : R[k].asker + ' asked a question') + '. It joined the end of the list, so nothing above it moved.');
    }
    if (what === 'cancel') {
      var t = R[M.selected] && R[M.selected].kind === 'task' && M.view === 'request' ? M.selected : M.open.filter(function (x) { return R[x].kind === 'task'; })[0];
      if (!t) return note('No task question is open. Choose A Task Asks a Question first.');

      if (t === M.selected) return close(t, { how: 'cancelled', at: now() }, info);
      M.open = M.open.filter(function (x) { return x !== t; }); M.closed[t] = { how: 'cancelled', at: now() };
      render(); return note(info.text + ' Its row left the list.');
    }

      if (!r || M.view !== 'request' || r.gone) return note('Open a request whose chat can still withdraw it first.');

      return close(wkey, { how: 'withdrawn', at: now(), why: by + ' said it was settled elsewhere.' }, { glyph: 'info', text: by + ' withdrew its ' + (r.kind === 'mention' ? 'message' : r.kind === 'task' ? 'question' : 'request') + ', so it no longer needs an answer. Anything you had typed for it is gone.', link: 'Show What Was Withdrawn' });
    }
  }

  /* ---- The states. Each has a key, a title for the index, and where it starts. ---- */
  var S = [
    { key: 'empty', title: 'No open requests', list: [] },
    { key: 'one', title: 'One request, nothing typed yet', list: ['r101'], selected: 'r101' },
    { key: 'several', title: 'Several requests, the oldest open', list: ALL, selected: 'r101' },
    { key: 'answering', title: 'Answering: own words for one, As Recommended for the other', list: ALL, selected: 'r101', draft: { 1: { choice: 'own', text: 'Ship it in 2.0.2, and tell me the timing after.' }, 2: { choice: 'rec' } }, focus: '#answer-1-text' },
    { key: 'multi', title: 'Five questions, two answered so far', list: ALL, selected: 'r103', draft: { 1: { choice: 'c0' }, 3: { choice: 'own', text: 'Publish when I approve it.' } } },
    { key: 'partly', title: 'Partly answered earlier', list: ALL, selected: 'r104' },
    { key: 'message', title: 'A plain message with a long quote, folded', list: ALL, selected: 'm102' },
    { key: 'message-open', title: 'The same message, opened in place', list: ALL, selected: 'm102', expanded: true, draft: { text: 'Cut the paragraph and ship on time. Leave the shortcut name for 2.0.3.' }, scrollTo: 'end' },

    { key: 'unconfirmed', title: 'Sending not confirmed', list: ALL, selected: 'r101', draft: { 1: { choice: 'own', text: 'Ship it in 2.0.2, and tell me the timing after.' }, 2: { choice: 'rec' } }, phase: 'unconfirmed' },
    { key: 'changed', title: 'The request changed while you answered', list: ALL, selected: 'r103', draft: { 1: { choice: 'c0' } }, phase: 'changed' },
    { key: 'confirm-dismiss', title: 'Dismissing asks first', list: ALL, selected: 'm102', dialog: true },
    { key: 'sent-leaves', title: 'A finished request leaves, and the next one opens', list: ['m102', 'r103', 'r104', 'r105'], selected: 'm102', closed: { r101: { how: 'sent', at: '11:02', answers: { 1: { text: 'Ship it in 2.0.2, and tell me the timing after.', at: '11:02' }, 2: { text: 'Cut the paragraph and ship on time.', at: '11:02' } } } }, status: { tone: 'positive', glyph: 'check', text: 'Your answers were sent to Release Engineer in Release 2.0.2.', link: 'Show Answers', act: 'record:r101' } },
    { key: 'last-done', title: 'The last request leaves', list: [], closed: { m102: { how: 'dismissed', at: '11:05' } }, done: { tone: 'positive', glyph: 'check', text: 'You dismissed the message from Dinah Design Review. No reply was sent.', link: 'Show the Message', act: 'record:m102' } },
    { key: 'filter', title: 'Filtering the list', list: ALL, filter: 'Harbor', selected: 'r103' },

    { key: 'task-ended', title: 'A task question closes because its task was cancelled', list: ALL.concat(['t107']), selected: 'r101', closed: { t106: { how: 'cancelled', at: '11:06' } }, status: { glyph: 'info', text: 'The task Publish the Harbor 07 release notes was cancelled, so its question closed. No answer was sent.' } },
    { key: 'earlier', title: 'More open requests than one page', list: ALL, more: true, selected: 'r101' },

    { key: 'task-text-over', title: 'An answer over the limit cannot be sent, and says by how much', list: WITH_TYPED, selected: 't112', draft: { text: 'Leave out fiscal printing, because the customer keeps its current fiscal provider for at least two more years and has a separate project for it, and leave out the older loyalty card scheme, which is being retired at the end of next quarter, together with any requirement that only concerns the head office reporting cube.' } },
    { key: 'task-multiple', title: 'A task asks you to choose from 1 to 2 options', list: WITH_TYPED, selected: 't113', draft: { picks: ['checkout'] } },
    { key: 'task-multiple-over', title: 'Too many chosen: the line says so and Send waits', list: WITH_TYPED, selected: 't113', draft: { picks: ['checkout', 'loyalty', 'returns'] } },
    { key: 'notifications', title: 'The same task questions in Notifications', list: WITH_TYPED, selected: 't112', notes: true },
    { key: 'row-menu', title: 'A row’s menu: the same commands for every entry, disabled with a reason where they cannot apply', list: WITH_TASKS, selected: 'r101', menu: 't107' },
    { key: 'dismiss-task', title: 'Dismissing a task question asks first and says the service is told', list: WITH_TASKS, selected: 't106', dialog: true },

  window.__mockStates = S.map(function (s) { return s.key; });

  /* A plain file path opens on several requests; ?state=index lists the states. */
  var asked = params.get('state') || 'several';
  var state = S.find(function (s) { return s.key === asked; });
  if (!state) {
    document.body.className = 'index';
    document.body.append(h('h1', { text: 'Decisions redesign mockup' }),
      h('p', { text: 'Every state below is a starting point, and from there the page works. Choose a request in the list, answer, send, dismiss, filter and open the record of a finished request. The Try menu in the title bar makes things happen that Paul cannot do from Decisions: a new request arrives, a task asks or is cancelled, the open request changes, or a send is not confirmed. It also switches between light and dark. Narrow the browser below 640 pixels to see the phone layout.' }),
      h('p', {}, h('a', { href: '?state=several', text: 'Start with several requests' }), ' is the best place to begin.'),

    filter: params.has('filter') ? params.get('filter') : state.filter || '', drafts: {}, expanded: {}, closed: Object.assign({}, state.closed || {}),

    else if (M.open.indexOf(k) >= 0 && k !== M.selected) { M.selected = k; M.status = null; M.phase = null; }
  });
  render();
  if (state.dialog) askDismiss();
  if (state.phase === 'sending' && !bare) { var tk = ++M.token, sk = M.selected; setTimeout(function () { if (M.token === tk) deliver(sk); }, 2500); }


  document.addEventListener('click', function (event) {
    var t = event.target;
    var row = t.closest('a.md-item'); if (row) { event.preventDefault(); return select(row.dataset.key); }
    if (t.closest('a.md-back')) { event.preventDefault(); M.pane = 'list'; if (M.view === 'record') { M.view = 'request'; M.selected = M.open[0] || null; } return render(); }
    var link = t.closest('a[data-opens]'); if (link) { event.preventDefault(); return note('In Dinah this opens ' + link.dataset.opens + '.'); }
    var toggle = t.closest('.card-toggle'); if (toggle) { var open = toggle.getAttribute('aria-expanded') !== 'true'; toggle.setAttribute('aria-expanded', String(open)); toggle.closest('.card').querySelector('.card-body').hidden = !open; return; }
    var b = t.closest('[data-act]'); if (b && !b.disabled) return act(b.dataset.act, b);
  });
  document.addEventListener('submit', function (event) { if (event.target.matches('form[role="search"]')) event.preventDefault(); });
  document.addEventListener('pudl:contextmenu', function (e) {
    var row = e.target.closest && e.target.closest('[data-row]'); if (!row) return;
    e.detail.add(rowCommands(row.dataset.row));
    e.detail.mark(row);
  });
  document.addEventListener('change', function (event) {
    if (event.target.matches('.mock-try select')) { var v = event.target.value; event.target.value = ''; if (v) tryIt(v); return; }
    if (readNoteDraft(event.target)) return;
    readDraft(); if (!M.phase) M.status = null; updateFoot(); if (M.selected) syncControls(M.selected);
  });
  /* Typing never redraws the page. Send depends only on whether there is an answer to send;
     saving a draft is never shown and never disables anything. Typing in a text area
     chooses My own answer, so nothing appears or disappears while answering. */
  document.addEventListener('input', function (event) {
    var el = event.target;
    if (el.id === 'filter') { M.filter = el.value; return render(); }
    var m = /^answer-(\d+)-text$/.exec(el.id || '');
    if (m && el.value.trim()) { var own = document.querySelector('input[name="answer-' + m[1] + '"][value="own"]'); if (own && !own.checked) own.checked = true; }
    if (readNoteDraft(el)) return;
    readDraft(); if (!M.phase) M.status = null; updateFoot(); if (M.selected) syncControls(M.selected);
  });
  /* A Notifications card's draft is the same draft Decisions has for that question. */
  function readNoteDraft(el) {
    var card = el.closest && el.closest('[data-note]'); if (!card) return false;
    var key = card.dataset.note, r = R[key], prefix = 'n-' + key + '-';
    if (r.answer) M.drafts[key] = typedDraft(r, prefix);
    else { var t = card.querySelector('input[name="' + prefix + 'answer-task"]:checked'); M.drafts[key] = t ? { task: t.value } : {}; }
    syncControls(key);
    if (key === M.selected) updateFoot();
    return true;
  }
  window.addEventListener('resize', function () { var n = window.innerWidth <= 640; if (n !== render.narrow) { render.narrow = n; render(); } });
  render.narrow = window.innerWidth <= 640;

  if (state.focus) { var el = document.querySelector(state.focus); if (el) el.focus({ preventScroll: true }); }
  if (state.scrollTo === 'end') document.fonts.ready.then(function () { var reply = document.getElementById('reply'); if (reply) reply.scrollIntoView({ block: 'center' }); document.documentElement.dataset.mockSettled = 'true'; });
  else if (state.menu) document.fonts.ready.then(function () { setTimeout(function () { var mb = document.querySelector('[data-row="' + state.menu + '"] [data-row-actions]'); if (mb) { mb.focus(); mb.click(); } document.documentElement.dataset.mockSettled = 'true'; }, 100); });
  else document.documentElement.dataset.mockSettled = 'true';
}());
