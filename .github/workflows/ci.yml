name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: {}

jobs:
  # The bodies of these two jobs live in composite actions under
  # .github/actions/, because promote.yml runs the same checks against a tree
  # it assembles by cherry-pick and a promoted tree has to be verified in its
  # own right. release.yml calls this whole file as a reusable workflow and
  # depends on its outcome through needs:, so nothing here reads a job name
  # by string; renaming test, gofmt, independent-reader, or extension does not
  # affect the release gate. See dinah-363.
  #
  # The completion script tests (dinah-601) skip a shell they cannot find
  # unless COMPLETION_REQUIRE_SHELLS names it, so each leg names the shells it
  # has to test. Windows names Git Bash by path, because the bash on a Windows
  # runner's PATH can be the WSL launcher, and the test refuses a bash that
  # reports no MSYSTEM. macOS names /bin/bash, which is bash 3.2, so the
  # script's path for a bash without compopt runs there for real. The verbose
  # step after the checks prints each script test's own log, which is where a
  # reader confirms which shells ran and which bash version the ASCII rule met.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: windows-latest
            require_shells: bash,powershell,pwsh
            bash: C:\Program Files\Git\bin\bash.exe
          - os: macos-latest
            require_shells: bash,zsh
            bash: /bin/bash
    runs-on: ${{ matrix.os }}
    # go-checks runs cmd/dinah twice, untagged and tagged tui, and the
    # untagged run starts its coverage pass on top, so the limit allows for
    # both on a slow Windows runner.
    timeout-minutes: 40
    env:
      COMPLETION_REQUIRE_SHELLS: ${{ matrix.require_shells }}
      COMPLETION_BASH: ${{ matrix.bash }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/go-checks
      - name: Completion script tests, with each test's log
        shell: bash
        run: go test -count=1 -v -run '^TestCompletionScript' ./cmd/dinah

  # The read budgets (dinah-621). A dedicated job on one platform, because a
  # timing measured while `go test ./...` runs every other package in
  # parallel measures the runner's contention, not Dinah, and because the
  # budgets are calibrated to one runner image. Windows is the platform
  # because file opens are what the budgets guard and Windows is where an
  # open costs most, so a regression in opens shows there first and largest.
  perf:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Read budgets
        shell: bash
        env:
          DINAH_PERF: ci
        run: |
          go test -count=1 -timeout 12m -run '^TestReadBudgets$' -v ./internal/perfstore | tee "$RUNNER_TEMP/perf.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if ! grep -q '^--- PASS: TestReadBudgets' "$RUNNER_TEMP/perf.log"; then
            echo "::error::TestReadBudgets did not report a pass; it skipped or did not run."
            exit 1
          fi

  # zsh and fish are not on an Ubuntu runner until they are installed, and this
  # is the one leg that tests both (dinah-601). The test fails rather than
  # skips when a shell COMPLETION_REQUIRE_SHELLS names is missing.
  completion-shells:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Install zsh and fish
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Shell versions
        run: |
          bash --version | head -n 1
          zsh --version
          fish --version
      - name: Completion script tests
        env:
          COMPLETION_REQUIRE_SHELLS: bash,zsh,fish
        run: go test -count=1 -v -run '^TestCompletionScript' ./cmd/dinah

  gofmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/gofmt-check

  # The independent reader of the interchange form (dinah-548). The reader
  # under conformance/interchange-reader/ was written from the profile alone by
  # an author that never saw this repository's code, and this job fails when it
  # and Dinah disagree about an export, a fixture it wrote, or a broken variant
  # of a real export, until a person has ruled which side is wrong in
  # conformance/interchange-reader-rulings.json.
  independent-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build dinah
        run: |
          mkdir -p "$RUNNER_TEMP/independent-reader"
          go build -o "$RUNNER_TEMP/independent-reader/dinah" ./cmd/dinah
      - name: Export every compatibility fixture
        env:
          DINAH_INTERCHANGE_EXPORT_DIR: ${{ runner.temp }}/independent-reader/exports
        run: go test -count=1 -run '^TestEveryCompatFixtureSurvivesTheInterchangePath$' ./internal/bench
      - name: Write the conformance report as JSON
        env:
          DINAH_CONFORMANCE_REPORT_JSON: ${{ runner.temp }}/independent-reader/conformance.json
        run: go test -count=1 -run '^TestConformanceReport$' ./internal/profile
      - name: The reader's own tests
        env:
          INTERCHANGE_READER_PROFILE: ${{ github.workspace }}/docs/spec/core-profile.md
        run: python -m unittest discover -s conformance/interchange-reader/tests -t conformance/interchange-reader -v
      - name: The comparison scripts' own tests
        run: python -m unittest discover -s scripts -p "test_interchange_reader_*.py" -v
      - name: Compare the reader with Dinah
        run: >-
          python scripts/interchange_reader_compare.py
          --dinah "$RUNNER_TEMP/independent-reader/dinah"
          --exports "$RUNNER_TEMP/independent-reader/exports"
          --conformance "$RUNNER_TEMP/independent-reader/conformance.json"
          --rulings conformance/interchange-reader-rulings.json
          --out "$RUNNER_TEMP/independent-reader/report"
      - name: Publish the report to the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/independent-reader/report/report.md" ]; then
            cat "$RUNNER_TEMP/independent-reader/report/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: independent-reader-report
          path: |
            ${{ runner.temp }}/independent-reader/report/report.json
            ${{ runner.temp }}/independent-reader/report/report.md
            ${{ runner.temp }}/independent-reader/exports/
          if-no-files-found: warn

  # The VS Code extension builds beside the Go jobs rather than inside them.
  # Windows is not optional: path handling, the .exe suffix and PATH
  # resolution are the most platform-sensitive code in editors/vscode, and
  # Windows is where they break. macOS is left off because the split this code
  # cares about is Windows against POSIX, and the Linux leg covers the POSIX
  # side.
  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      # The integration tests build their fixtures with this commit's own
      # binary, so the Go toolchain is a dependency of the extension job too.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: npm ci

      # editors/vscode/go.mod fences the npm dependency tree out of the dinah
      # Go module, because an npm dependency ships Go source under
      # node_modules and Go's package walk would otherwise compile it
      # (dinah-274). This job is the only one that installs npm packages, so
      # it is the only place the boundary can be checked against a tree that
      # actually holds the hazard.
      #
      # Both steps run from the repository root rather than the job's default
      # working directory, and both name bash explicitly because the Windows
      # leg of this matrix would otherwise run them under PowerShell.
      #
      # The first step proves the hazard is present before the second proves
      # it is hidden. Without it, a dependency graph that stops vendoring Go
      # source would leave the second step passing while checking nothing.
      - name: Confirm the install vendored a Go package under editors/vscode
        working-directory: .
        shell: bash
        run: |
          mv editors/vscode/go.mod editors/vscode/go.mod.disabled-for-boundary-check
          found="$(go list ./... | grep editors/vscode || true)"
          mv editors/vscode/go.mod.disabled-for-boundary-check editors/vscode/go.mod
          if [ -z "$found" ]; then
            echo "::error::With editors/vscode/go.mod removed, go list ./... found no package under editors/vscode. Either npm ci did not install anything, or no current dependency vendors Go source. Either way the next step would prove nothing."
            exit 1
          fi
          echo "go list ./... finds these with the boundary removed:"
          echo "$found"

      - name: Confirm the module boundary hides it
        working-directory: .
        shell: bash
        run: |
          hidden="$(go list ./... | grep editors/vscode || true)"
          if [ -n "$hidden" ]; then
            echo "::error::go list ./... still reports a package under editors/vscode with editors/vscode/go.mod in place:"
            echo "$hidden"
            exit 1
          fi

      - run: npm run check-types
      - run: npm run lint
      - run: npm run test:unit

      # @vscode/test-electron downloads a real VS Code and runs the tests
      # inside a real extension host, which needs a display on Linux.
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Integration tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:integration

      - run: npm run package
      - run: npm run verify-package

      - name: Upload the packaged extensions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vsix-${{ matrix.os }}
          path: editors/vscode/vsix/*.vsix
          if-no-files-found: error
