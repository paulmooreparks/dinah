name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The bodies of these two jobs live in composite actions under
  # .github/actions/, because promote.yml runs the same checks against a tree
  # it assembles by cherry-pick and a promoted tree has to be verified in its
  # own right. The job names stay here, and they stay exactly as they were,
  # because release.yml's publish gate waits for check runs by name.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go-checks

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gofmt-check

  # The VS Code extension builds beside the Go jobs rather than inside them.
  # Windows is not optional: path handling, the .exe suffix and PATH
  # resolution are the most platform-sensitive code in editors/vscode, and
  # Windows is where they break. macOS is left off because the split this code
  # cares about is Windows against POSIX, and the Linux leg covers the POSIX
  # side.
  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      # The integration tests build their fixtures with this commit's own
      # binary, so the Go toolchain is a dependency of the extension job too.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm run check-types
      - run: npm run lint
      - run: npm run test:unit

      # @vscode/test-electron downloads a real VS Code and runs the tests
      # inside a real extension host, which needs a display on Linux.
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Integration tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:integration

      # Every platform vsix carries one binary, so the six are cross-compiled
      # here. dinah has no cgo, so six cross-builds on one runner cost a few
      # seconds and buy an archive check that can actually run.
      - name: Cross-compile the six release binaries
        shell: bash
        run: node scripts/build-binaries.mjs .binaries
      - run: npm run package -- --binaries .binaries
      - run: npm run verify-package

      - name: Upload the packaged extensions
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: editors/vscode/vsix/*.vsix
          if-no-files-found: error
