name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: &os-matrix [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go version
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./...

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go version
      - name: gofmt
        run: |
          # Scoped to the Go trees rather than run from the root. `gofmt -l .`
          # descends into editors/vscode/node_modules/, so an npm dependency
          # that vendors an unformatted .go file as testdata would turn this
          # job red for a reason that has nothing to do with this repository's
          # own code.
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would reformat:"
            echo "$unformatted"
            exit 1
          fi

  # The suites under scripts/hooks/ cover the guard that refuses destructive
  # git against the operator's live checkout. Until this job existed nothing in
  # the build ran them: they executed only when a person remembered to invoke
  # them by hand, which is not a defensible gate for that file. The OS list is
  # an alias of the one `test` declares, so the two cannot drift apart the way
  # two typed-out copies could. GitHub Actions has supported YAML anchors and
  # aliases since September 2025; merge keys (`<<:`) it still does not, which
  # is why this is an alias of a whole list rather than a merge.
  hook-tests:
    strategy:
      fail-fast: false
      matrix:
        os: *os-matrix
    runs-on: ${{ matrix.os }}
    steps:
      # test-guard-against-a-real-shell.py reads the deployed guard with
      # `git show origin/main:scripts/hooks/deny-destructive-git.py` and treats
      # an unreadable trunk as a hard failure rather than a skip. The action's
      # shallow default does not guarantee that origin/main resolves, so the
      # suite would go red for a reason unrelated to the guard.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The runner images all ship a Python 3, but which one they ship changes
      # over time and is not a pinned contract. This is.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python --version
      # Three steps rather than one command chain, so a failing suite names
      # itself in the Checks UI instead of hiding behind whichever ran first.
      - name: Guard cases
        run: python scripts/hooks/test-deny-destructive-git.py
      - name: Guard against a real shell
        run: python scripts/hooks/test-guard-against-a-real-shell.py
      - name: Hook registration is cwd-independent
        run: python scripts/hooks/test-hook-registration-cwd-independence.py

  # The VS Code extension builds beside the Go jobs rather than inside them.
  # Windows is not optional: path handling, the .exe suffix and PATH
  # resolution are the most platform-sensitive code in editors/vscode, and
  # Windows is where they break. macOS is left off because the split this code
  # cares about is Windows against POSIX, and the Linux leg covers the POSIX
  # side.
  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      # The integration tests build their fixtures with this commit's own
      # binary, so the Go toolchain is a dependency of the extension job too.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm run check-types
      - run: npm run lint
      - run: npm run test:unit

      # @vscode/test-electron downloads a real VS Code and runs the tests
      # inside a real extension host, which needs a display on Linux.
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Integration tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:integration

      # Every platform vsix carries one binary, so the six are cross-compiled
      # here. dinah has no cgo, so six cross-builds on one runner cost a few
      # seconds and buy an archive check that can actually run.
      - name: Cross-compile the six release binaries
        shell: bash
        run: node scripts/build-binaries.mjs .binaries
      - run: npm run package -- --binaries .binaries
      - run: npm run verify-package

      - name: Upload the packaged extensions
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: editors/vscode/vsix/*.vsix
          if-no-files-found: error
