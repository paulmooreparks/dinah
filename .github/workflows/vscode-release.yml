# Cut a GitHub release carrying a marketplace-ready archive whenever anything
# under editors/vscode changes on main, and publish it when the operator has
# said it may be published.
#
# The archive's number is minted here rather than read out of the manifest.
# editors/vscode/package.json's version field is a floor: it names a
# major.minor line, its patch component is always 0, and nobody ships the
# committed string as read. The compute-version job below reads the release
# history and takes the next patch on that line, which is what lets every merge
# cut a release without anybody typing a number. A human still moves the major
# or the minor by hand when a change earns it.
#
# The number must never be derived from a dinah release tag. That derivation
# existed once and it published a dev build as 0.1.42 and then the real release
# as 0.1.0, which the marketplace read as older and never offered as an update.
# editors/vscode/scripts/version.mjs carries that history in its header.
#
# The trigger is the path rather than the version field, because there is no
# version field left to bump. A docs-only or test-only change under
# editors/vscode cuts a release like any other change: packaging writes the
# computed version into the archive, so the bytes differ on every run this
# trigger fires for, and the operator's rule is that a new archive means a new
# release.
#
# The tag is reserved before anything is built, which is release.yml's own
# discipline and is here for release.yml's own reason. Two pushes landing close
# together can read the same release list and compute the same next patch. Only
# the first POST to git/refs succeeds; the second fails with 422 and takes its
# whole run down, which is the loud answer rather than one run quietly
# publishing over the other's number. Nothing retries, and a failed run is
# re-triggered by hand.
#
# A run that reserves a tag and then fails leaves that tag pointing at code
# that never shipped, so cleanup-tag deletes it again, mirroring release.yml.
#
# There is no collision handling downstream any more, and its absence is
# deliberate rather than an oversight. Two steps used to decide what happened
# when the computed tag already carried a release, one replacing it on a
# dispatched run and one refusing on a push. They existed because a dispatched
# run released whatever the manifest currently said, which a push could already
# have released. compute-version mints an unreserved tag by construction, so
# neither step can fire and both are gone.

name: VS Code extension release

on:
  push:
    branches: [main]
    paths:
      - "editors/vscode/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # One job answers for both triggers. A dispatched run computes its version
  # exactly as a push does rather than reading whatever is committed, which is
  # what lets it cut the very first release with nothing on main to diff
  # against, and it keeps the repository down to a single numbering rule.
  compute-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the tag ref this run reserves
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The --jq filter only selects and maps, so it is safe to apply per page:
      # `gh api --help` states that under --paginate "each page is a separate
      # JSON array or object", and the pages then concatenate into one stream
      # carrying every release. A filter that reduced would answer once per page
      # instead. The arithmetic that turns this list into a single next number
      # lives in scripts/release-version.mjs, where a unit test drives it,
      # rather than in a shell reduction nothing can exercise.
      #
      # The committed floor is read by the same script, which refuses a nonzero
      # committed patch. So a hand-typed release number in the manifest fails
      # this job loudly, before anything is packaged or reserved.
      - name: Compute and reserve the next extension version
        id: version
        working-directory: editors/vscode
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          set -o pipefail
          gh api "repos/$REPO/releases" --paginate --jq '.[] | .tag_name' > /tmp/tags.txt
          VERSION=$(node scripts/print-next-version.mjs package.json /tmp/tags.txt)
          TAG="vscode-v$VERSION"
          echo "This run is $TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          SHA=$(git rev-parse HEAD)
          echo "Reserving $TAG at $SHA"
          gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA"

  # CI runs as a job of this workflow rather than being polled by SHA and by
  # check-run name. release.yml moved to this shape in dinah-363, and ci.yml
  # gained workflow_call in the same commit; ci.yml's own header now says that
  # nothing reads its three job names by string, so a workflow that matched
  # those names would be the one file holding a contract the rest of the
  # repository has dropped. Depending on the nested run instead removes the
  # name matching, the paged check-run read and the timeout ceiling in one
  # go, because nothing is polling and nothing is timing.
  #
  # The cost, stated rather than minimised: this runs ci.yml's Go test matrix
  # on a commit whose only artifact is an archive carrying no Go code, and it
  # runs ci.yml a second time on top of that file's own push trigger. Both are
  # redundant work, and both are now paid on every extension change rather than
  # on every version bump, which is what the operator asked for. A commit whose
  # repository is broken is not one to publish an extension from. See D-7.
  ci:
    needs: compute-version
    uses: ./.github/workflows/ci.yml

  # The gate names both dependencies' results and requires the literal string
  # success, rather than leaving the job unconditioned and resting on the
  # platform's own handling of a dependency that did not succeed. failure,
  # cancelled and skipped are all refused by the same comparison, so nothing
  # is packaged or released unless CI plainly passed. This is release.yml's
  # own shape, and dinah-363 D-4 records why it is written out.
  package-and-release:
    needs: [compute-version, ci]
    if: needs.compute-version.result == 'success' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release and uploads its asset
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      # The newest dev release is found by sorting on the created_at field the
      # response already carries. The releases endpoint documents no ordering
      # guarantee, so nothing leans on the order the list arrives in. Nothing
      # downloads the release either, because the archive carries no binary.
      # The tag is provenance: it reaches the build through
      # DINAH_PAIRED_RELEASE and ends up on the status bar's line saying which
      # dinah release this build was tested against.
      #
      # The sort runs on the far side of the pipe, and that placement is the
      # point of the shape. `gh api --help` states that under --paginate
      # "each page is a separate JSON array or object", so a --jq filter is
      # applied once per page. A filter that reduces, as an earlier round of
      # this step did with `[...] | sort_by(.created_at) | last`, therefore
      # emits one tag per page instead of one tag, and the step then wrote all
      # of them to $GITHUB_OUTPUT as an undelimited multi-line value the runner
      # refuses. It answered correctly only because this repository's 92
      # releases fit in one page, and release.yml cuts a dev release on most
      # pushes to main, so that count is walking toward the boundary.
      #
      # The filter below only selects and maps, so applying it per page is
      # harmless: the pages concatenate into one stream carrying every matching
      # release, and `sort | tail -n 1` then picks over that whole stream.
      # created_at is documented as ISO 8601 in UTC (YYYY-MM-DDTHH:MM:SSZ),
      # which is fixed-width, so its lexical order is its chronological order
      # and `sort` needs no key specification. Nothing here needs jq or gh's
      # --slurp, so nothing here rests on either being present.
      - name: Find the newest dev release
        id: dev-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          set -o pipefail
          TAG=$(gh api "repos/$REPO/releases" --paginate \
            --jq '.[] | select((.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-dev$")) or (.tag_name | test("^v[0-9]+\\.[0-9]+\\.0-dev\\.[0-9]+$"))) | .created_at + " " + .tag_name' \
            | sort | tail -n 1 | cut -d " " -f 2)
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::no dev release found on $REPO; there is nothing to pair this extension build's provenance with"
            exit 1
          fi
          # A per-page answer is several tags rather than one, and writing a
          # multi-line value to the output file with no delimiter kills the
          # run several steps later with a message about the file's format
          # rather than about this lookup. This refuses it here and names it.
          if [ "$(printf '%s' "$TAG" | wc -l)" != "0" ]; then
            echo "::error::the dev release lookup returned more than one tag, so it answered per page rather than over the whole collection"
            printf '%s\n' "$TAG"
            exit 1
          fi
          echo "Newest dev release is $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The version is handed to the packaging script rather than looked up by
      # it, and nothing after this step may read package.json's version back
      # out. package.mjs rewrites the manifest to the computed number, packages,
      # and restores the committed floor in a finally block, so a later read
      # would find the floor and tag the release with it.
      - name: Package the archive
        env:
          DINAH_PAIRED_RELEASE: ${{ steps.dev-release.outputs.tag }}
        run: |
          npm ci
          npm run package -- --version "${{ needs.compute-version.outputs.version }}"
          npm run verify-package

      - name: Confirm exactly one archive was produced
        run: |
          set -e
          FOUND=$(ls -1 vsix/*.vsix 2>/dev/null | wc -l)
          if [ "$FOUND" != "1" ] || [ ! -f vsix/dinah-universal.vsix ]; then
            echo "::error::expected exactly one archive, vsix/dinah-universal.vsix; found $FOUND"
            ls -1 vsix/ || true
            exit 1
          fi
          echo "One archive, as expected."

      # The asset list names the one archive and nothing else. vsix/manifest.json
      # is written beside it by package.mjs so that verify-package.mjs and a
      # person reading the directory can correlate target to archive, and it
      # has no reader outside this repository.
      #
      # The tag is the one compute-version already reserved, out of the CLI's
      # tag namespace. Every dinah CLI tag starts with "v" followed immediately
      # by a digit (v0.1.126-dev, v0.1.0-beta, v0.1.0), and the extension's
      # number runs on its own cadence, so the two can meet. The vscode-v prefix
      # keeps the namespaces disjoint by construction.
      #
      # The paths here are repository-relative rather than relative to the
      # job's working directory, because this step is an action rather than a
      # run step and the defaults.run setting above does not reach it.
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.compute-version.outputs.tag }}
          name: "Dinah for VS Code ${{ needs.compute-version.outputs.version }}"
          body: |
            Dinah for VS Code, version ${{ needs.compute-version.outputs.version }}.

            This extension is a companion to the dinah command-line tool and does not carry a copy of it. Install dinah yourself, then install this extension from the Extensions view ("Install from VSIX...") or with `code --install-extension`; the extension finds dinah on your PATH or at the location the `dinah.path` setting names, and tells you where to get it if it finds neither.
          files: editors/vscode/vsix/dinah-universal.vsix

      # This step stays dormant until the operator uploads a token. Whether a
      # marketplace publisher credential may live in this repository's Actions
      # secrets at all is his call and nobody else's, so the step is skipped
      # whenever the secret is absent and the run still finishes having
      # attached the archive to its release.
      #
      # The token reaches vsce through VSCE_PAT, which is where vsce looks by
      # default, rather than through a -p flag that would put it on the
      # command line. --skip-duplicate turns vsce's refusal to republish a
      # version the marketplace already carries into a logged no-op, so a
      # re-run of this workflow, or a re-run after the release step succeeded
      # and this one was interrupted, does nothing instead of failing.
      #
      # vsce is named through its module path the way package.mjs names it.
      # npm ci does not put node_modules/.bin on PATH for a workflow step, so
      # a bare vsce would be found only on a machine that had installed it
      # globally, and this step would fail the first time it ever ran for
      # real.
      - name: Marketplace publish
        if: env.VSCE_PAT != ''
        run: |
          set -e
          node node_modules/@vscode/vsce/vsce publish --pre-release --skip-duplicate --packagePath vsix/dinah-universal.vsix

  # The tag is reserved before anything is verified, so a run that reserves one
  # and then fails would leave it pointing at code that never shipped and would
  # burn that patch number permanently. This deletes it again, and it fires only
  # when compute-version itself succeeded, because a run that never reserved a
  # tag has nothing to clean up. release.yml carries the same job for the same
  # reason.
  cleanup-tag:
    needs: [compute-version, ci, package-and-release]
    if: always() && needs.compute-version.result == 'success' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    permissions:
      contents: write # deletes the tag ref this run created
    steps:
      - name: Delete the tag this run reserved
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.compute-version.outputs.tag }}
        run: |
          echo "This run reserved $TAG and then failed, so the tag is being deleted."
          gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG"
