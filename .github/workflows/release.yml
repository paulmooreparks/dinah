# Build dinah for six platform/architecture pairs on every push to main,
# publish a SHA-256 for each one, and attach the lot to a GitHub Release so
# a person with the project page open can download a binary and run it.
#
# The version comes from the VERSION file at the repository root. A push to
# main cuts a dev release tagged v{VERSION}.{N}-dev, where N is one more
# than the highest dev tag that already exists on the remote for the same
# major.minor. The counter is read from the tags API rather than from a
# local commit count, because a commit count is not monotonic across a
# rebase and two runs can compute the same number from it.
#
# Tags published before dinah-361 carry that counter in the pre-release label
# with the patch pinned at zero (v0.1.0-dev.73), and the operator ruled that
# none of them is ever rewritten. So the tag list carries both shapes
# permanently, and the counter is computed across both of them. Reading only
# the new shape would find no tags at all on a line that had reached the
# seventies and would restart the numbering at one. docs/release.md says where
# the discontinuity is and why.
#
# The tag is created before anything is built. Two pushes landing close
# together can still both compute the same N, but only the first createRef
# call succeeds; the second fails with 422 and takes its whole run down,
# which is the loud answer rather than one run quietly overwriting the
# other's tag.

name: Release

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "go.mod"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/release.yml"

  workflow_dispatch: {}

# Read-only by default, with each job asking for what it actually needs. Only
# the jobs that write to the repository get write access: the two that create
# or delete the tag, and the one that publishes the release.
permissions:
  contents: read

jobs:
  # Resolve and reserve the tag once, at the top of the run, so every job
  # below builds and publishes under the same name.
  compute-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the tag ref
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Compute and reserve the dev tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          BASE=$(tr -d '[:space:]' < VERSION)

          # Page through the repository's tags at the API maximum of 100 per
          # page. dinah will not need a second page for a long time, and the
          # page guard aborts rather than looping if that ever changes.
          PAGE=1
          : > all-tags.txt
          while :; do
            RESULT=$(gh api -X GET "repos/$REPO/tags" -F per_page=100 -F page=$PAGE --jq '.[].name' || true)
            if [ -z "$RESULT" ]; then
              break
            fi
            printf '%s\n' "$RESULT" >> all-tags.txt
            COUNT=$(echo "$RESULT" | wc -l)
            if [ "$COUNT" -lt 100 ]; then
              break
            fi
            PAGE=$((PAGE + 1))
            if [ "$PAGE" -gt 20 ]; then
              echo "::error::tag pagination ran past 2000 entries; aborting to avoid an infinite loop"
              exit 1
            fi
          done

          # Which tag comes next is a rule with two shapes in it and a reset
          # per line, so it is decided by tested Go rather than by shell that
          # nothing can exercise. internal/release/tags_test.go drives the same
          # code against a fixture list mixing the old and new shapes.
          TAG=$(go run ./cmd/dinah-release next-tag --channel dev --base "$BASE" < all-tags.txt)
          echo "This run is ${TAG}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          SHA=$(git rev-parse HEAD)
          echo "Reserving $TAG at $SHA"
          gh api -X POST "repos/$REPO/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$SHA"

      # The platform list is declared once, in internal/release/targets.go, and
      # read from here by the build matrix below and by the release job's asset
      # check. A workflow that spelled the list twice could pass a build whose
      # dist/ was checked against a different set of names than it produced.
      - name: Resolve the platform target list
        id: targets
        run: |
          set -eo pipefail
          # The assignment carries the exit status, which a command
          # substitution inside echo does not: a go run that died there would
          # write an empty targets= and leave the step green, and the failure
          # would surface two jobs later as a matrix that will not parse.
          TARGETS=$(go run ./cmd/dinah-release targets --format json)
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  # ci.yml runs as a job of this workflow rather than being polled by SHA. A
  # job that "needs" this one blocks on the native GitHub Actions dependency
  # graph until every job inside ci.yml finishes, which is what removes the
  # guess this card was filed over: there is no aggregate ceiling to raise as
  # the suite grows, because nothing here is timing anything. See dinah-363.
  #
  # This does mean ci.yml's three jobs run twice on a push to main that also
  # matches this file's own path filter below: once under ci.yml's own
  # unfiltered push trigger, and once nested here. The alternative, removing
  # ci.yml's own push trigger to avoid the duplication, was rejected because
  # ci.yml's trigger has no path filter and this file's does (it does not
  # include editors/vscode/**), so a push touching only extension code would
  # then get no CI on main at all. Doubling a run whose slowest leg is a few
  # minutes, only on the commits that are already release candidates, is the
  # bounded cost; a silent coverage gap on trunk is not. The two runs can
  # disagree on a flaky test or flaky extension leg, but the disagreement
  # cannot reach a release decision: this file only ever depends on the ci
  # job below, its own nested run, and never reads the standalone run's
  # result by any means. See D-3.
  ci:
    uses: ./.github/workflows/ci.yml

  # Every binary is cross-compiled from one Linux runner. dinah has no cgo
  # and no dependencies outside the standard library, so a native runner per
  # target buys nothing.
  #
  # The if: below reads the two dependencies' own results and requires the
  # literal string success, rather than leaving this job unconditioned and
  # resting on the platform's default handling of a dependency that did not
  # succeed. failure, cancelled and skipped are all refused by the same
  # comparison, because none of them equals success, so a release is withheld
  # whenever CI did not plainly pass. See dinah-363 D-4.
  build:
    needs: [compute-version, ci]
    if: needs.compute-version.result == 'success' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include: ${{ fromJSON(needs.compute-version.outputs.targets) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build dinah
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ needs.compute-version.outputs.tag }}
        run: |
          go build -trimpath -ldflags="-s -w -X dinah/internal/verb.ToolRelease=${TAG}" \
            -o dist/dinah-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/dinah

      - name: Upload the binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # This job's own gate names build rather than ci, because build is what it
  # depends on directly and build already refused to run unless ci succeeded.
  # Each job's condition stays readable without tracing the whole chain.
  release:
    needs: [compute-version, build]
    if: needs.compute-version.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release and uploads its assets
      id-token: write # mints the token the provenance attestation is signed with
      attestations: write # records that attestation against the repository
    steps:
      # The checkout comes before the download because actions/checkout cleans
      # the workspace it lands in, and the binaries would go with it.
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The asset check below runs the same declaration the build matrix read,
      # so this job needs a toolchain even though it compiles nothing itself.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # The pattern is what keeps this download to the platform binaries. Every
      # artifact of the run is a candidate otherwise, and since dinah-363 made
      # ci.yml a job of this run, the archive that job packages is one of them.
      # An unfiltered download therefore put that archive into dist/ on every
      # run (dinah-412). Each upload of the build job is named for its own
      # platform pair under a binaries- prefix, and
      # internal/release/download_filter_test.go holds this pattern against
      # those names and against the names every other job of the run uploads
      # under.
      #
      # The step below still checks what actually landed. A filter narrows what
      # is asked for and can say nothing about what an artifact carries inside
      # it, so the two are not alternatives.
      - name: Download every binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binaries-*
          path: dist/
          merge-multiple: true

      # A release naming fewer binaries than the matrix builds is worse than no
      # release, because the manifest would tell a person on a missing platform
      # that no build exists for their machine. A release naming more is worse
      # again: the download step takes every artifact this run produced, ci.yml
      # runs as a job of this run, and its extension archive rode along on real
      # releases for weeks because the check here only looked for six names and
      # had no opinion about a seventh file (dinah-396).
      #
      # So the assertion runs in both directions. dist/ has to hold the six
      # platform binaries and nothing else, and either kind of difference stops
      # the run before anything is attached to a release.
      #
      # Position matters. SHA256SUMS.txt does not exist yet at this point in the
      # job, because the channel-manifest action writes it in a later step, so
      # moving this step after that one would fail every run.
      - name: Confirm dist/ carries exactly what a release should carry
        run: |
          set -eo pipefail
          go run ./cmd/dinah-release targets --format names | sort > expected.txt
          # -maxdepth 1 -mindepth 1 lists everything directly inside dist/ and
          # descends into nothing, so an artifact that arrives as a directory
          # is reported by its own name rather than passed over. A correct
          # build leaves six regular files there and nothing else, so listing
          # directories too cannot fail a run that should pass.
          find dist -maxdepth 1 -mindepth 1 -printf '%f\n' | sort > actual.txt
          if ! diff -u expected.txt actual.txt > dist-diff.txt; then
            echo "::error::dist/ does not hold exactly the expected release binaries"
            echo "--- expected  +++ actually present in dist/"
            cat dist-diff.txt
            exit 1
          fi
          echo "dist/ holds exactly the $(wc -l < expected.txt) expected binaries."

      - name: Check the release number reached the binary
        env:
          TAG: ${{ needs.compute-version.outputs.tag }}
        run: |
          set -e
          # An artifact download does not preserve the executable bit.
          chmod +x dist/dinah-linux-amd64
          REPORTED=$(dist/dinah-linux-amd64 --json version)
          echo "$REPORTED"
          if ! printf '%s' "$REPORTED" | grep -qF "\"tool\": \"${TAG}\""; then
            echo "::error::the linux/amd64 binary reports something other than ${TAG}; the ldflags injection did not reach verb.ToolRelease"
            exit 1
          fi

      - name: Write the checksums and the channel manifest
        uses: ./.github/actions/channel-manifest
        with:
          channel: dev
          tag: ${{ needs.compute-version.outputs.tag }}
          repository: ${{ github.repository }}

      # A release names a URL, and a URL says nothing about where the bytes
      # behind it were built. This records a signed statement, against this
      # repository, that these exact binaries came out of this workflow at this
      # commit, so somebody who distrusts the download can check it rather than
      # take it on faith:
      #
      #     gh attestation verify dinah-windows-amd64.exe --repo paulmooreparks/dinah
      #
      # It attests the binaries and not SHA256SUMS.txt, because that file is
      # derived from them and an attestation over a list of hashes proves only
      # that the list was built here.
      #
      # The two extra permissions are what signing costs. id-token mints the
      # short-lived token the signature is made with, and attestations records
      # the result against the repository. Neither grants any further reach
      # over the repository's contents.
      - name: Attest that these binaries were built here
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/dinah-*

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.compute-version.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/dinah-*
            dist/SHA256SUMS.txt

      - name: Publish the dev channel manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # "channels" is a rolling release that exists to host one manifest
          # per channel at a URL that never changes, which is what the install
          # scripts fetch.
          if ! gh release view channels --repo "$REPO" >/dev/null 2>&1; then
            echo "Creating the rolling 'channels' release"
            gh release create channels \
              --repo "$REPO" \
              --title "Channel manifests" \
              --notes "A rolling release that hosts one manifest per channel. Each manifest names the current tag for its channel and lists every binary published under that tag with its SHA-256 and its size. The install scripts under scripts/ read these files."
          fi
          gh release upload channels manifest/dev.json --repo "$REPO" --clobber
          echo "Updated dev.json on the 'channels' release"

  # The tag is reserved before CI has ruled, which is what makes two concurrent
  # runs collide loudly rather than overwrite each other. A run that then fails
  # would leave a tag with no release behind it, so anyone checking that tag out
  # would land on code that did not pass. This deletes the tag the failed run
  # reserved, and it runs only when the reservation itself succeeded and
  # something after it did not.
  cleanup-tag:
    needs: [compute-version, ci, build, release]
    if: always() && needs.compute-version.result == 'success' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    permissions:
      contents: write # deletes the tag ref this run created
    steps:
      - name: Delete the tag this run reserved
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.compute-version.outputs.tag }}
        run: |
          echo "This run reserved $TAG and then failed, so the tag is being deleted."
          gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG"
