# Verifies Dinah on Windows, Linux and macOS, builds it for each, and on a push
# to master publishes the result as the "latest" prerelease, replacing the one
# before it, so that the newest build can always be downloaded from the same
# place. A pull request runs the same verification and builds, and never
# publishes.
#
# go.mod replaces dinah-extension-go with a sibling folder, so that repository
# is checked out beside this one in every job. Its main branch has to contain
# whatever this commit needs from it.
#
# Two kinds of evidence come out of a run, and they are not the same thing:
#
#   verify   runs gofmt, go vet and go test natively on each operating system
#            and processor the archives are built for. A test that passes here
#            ran on that system. go vet also type-checks the window's desktop
#            build (the Wails tags) natively, with cgo where the system needs it.
#   browser  runs the window's browser suites (cmd/dinah-desktop/frontend/e2e)
#            in Microsoft Edge with the Go side stubbed. They test the page in a
#            Chromium browser on that system, not the native webview (WebView2,
#            WebKitGTK or WKWebView) and not the native window around it; see
#            "Continuous Integration" in that folder's README.
#   build    produces the archives. Windows arm64 is cross-compiled on an amd64
#            runner, and the macOS universal binary holds an amd64 slice built
#            on an arm64 Mac; both are covered by verify on their own runners,
#            but the archived binaries themselves are never run.
#
# Each verify and browser job keeps its logs, and the browser suites' failures
# and screenshots, as a diagnostics artifact, whether it passed or failed.
name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per pull request, and one for master, each replacing the last.
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-amd64, os: windows-latest, tags: "desktop,production" }
          - { name: windows-arm64, os: windows-11-arm, tags: "desktop,production" }
          - { name: linux-amd64, os: ubuntu-24.04, tags: "desktop,production,webkit2_41" }
          - { name: linux-arm64, os: ubuntu-24.04-arm, tags: "desktop,production,webkit2_41" }
          - { name: macos-arm64, os: macos-latest, tags: "desktop,production" }
          - { name: macos-amd64, os: macos-15-intel, tags: "desktop,production" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: dinah
    env:
      DIAG: ${{ github.workspace }}/diagnostics
    steps:
      # Windows runners check out with core.autocrlf=true, and gofmt reports
      # every file with CRLF line endings. The files are tested as committed.
      - name: Keep line endings as committed
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: dinah
      - uses: actions/checkout@v4
        with:
          repository: paulmooreparks/dinah-extension-go
          path: dinah-extension-go
      - uses: actions/setup-go@v5
        with:
          go-version-file: dinah/go.mod
          cache-dependency-path: dinah/go.sum

      - name: Install the Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Record the environment
        run: |
          mkdir -p "$DIAG"
          { uname -a; go version; go env; pwsh -NoProfile -Command '$PSVersionTable | Out-String'; } > "$DIAG/environment.txt" 2>&1
          go version

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . | tee "$DIAG/gofmt.txt")"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            gofmt -d . > "$DIAG/gofmt.diff"
            exit 1
          fi

      - name: Vet
        run: go vet ./... 2>&1 | tee "$DIAG/go-vet.txt"

      # The window's own build, with the tags its archive is built with. On
      # Linux and macOS this compiles the cgo webview bindings natively.
      - name: Vet the desktop build
        run: go vet -tags "${{ matrix.tags }}" ./cmd/dinah-desktop 2>&1 | tee "$DIAG/go-vet-desktop.txt"

      # Through the gate script, as the repository asks of a full run. -v keeps
      # each test's name, result and time in the log for diagnosis; the
      # deadlines are go test's own.
      - name: Test
        run: pwsh -NoProfile -File scripts/go-gate.ps1 -count=1 -v ./... 2>&1 | tee "$DIAG/go-test.txt"

      - name: Summarise test failures
        if: failure()
        run: |
          grep -E '^(--- FAIL|FAIL|panic:)' "$DIAG/go-test.txt" | tee "$DIAG/go-test-failures.txt" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-verify-${{ matrix.name }}
          path: diagnostics
          if-no-files-found: warn

  browser:
    name: Browser suites ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest }
          - { name: linux, os: ubuntu-24.04 }
          - { name: macos, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: dinah/cmd/dinah-desktop/frontend/e2e
    env:
      E2E_OUT: ${{ github.workspace }}/diagnostics
    steps:
      - uses: actions/checkout@v4
        with:
          path: dinah
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dinah/cmd/dinah-desktop/frontend/e2e/package-lock.json
      - run: npm ci

      # The suites drive Microsoft Edge where lib/page.js expects it on each
      # system. The runner images include it; a missing Edge fails here rather
      # than as forty suites that cannot launch.
      - name: Find Microsoft Edge
        run: |
          case "$RUNNER_OS" in
            Windows) edge='C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe' ;;
            macOS) edge='/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge' ;;
            *) edge='/usr/bin/microsoft-edge' ;;
          esac
          mkdir -p "$E2E_OUT"
          test -x "$edge" || { echo "::error::Microsoft Edge is not at $edge"; exit 1; }
          "$edge" --version 2>/dev/null | tee "$E2E_OUT/browser.txt" || echo "$edge" > "$E2E_OUT/browser.txt"

      # run.ps1 prints one line per suite and only the failing suites' lines;
      # failures.txt and the screenshots are kept in the artifact.
      - name: Run the browser suites
        run: pwsh -NoProfile -File ./run.ps1 -Out "$E2E_OUT" 2>&1 | tee "$E2E_OUT/run.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-browser-${{ matrix.name }}
          path: diagnostics
          if-no-files-found: warn

  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-amd64, os: windows-latest, goos: windows, goarch: amd64 }
          - { name: windows-arm64, os: windows-latest, goos: windows, goarch: arm64 }
          - { name: linux-amd64, os: ubuntu-24.04, goos: linux, goarch: amd64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { name: macos-universal, os: macos-latest, goos: darwin, goarch: universal }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: dinah
    steps:
      - uses: actions/checkout@v4
        with:
          path: dinah
      - uses: actions/checkout@v4
        with:
          repository: paulmooreparks/dinah-extension-go
          path: dinah-extension-go
      - uses: actions/setup-go@v5
        with:
          go-version-file: dinah/go.mod
          cache-dependency-path: dinah/go.sum

      - name: Install the Linux webview libraries
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build for Windows
        if: matrix.goos == 'windows'
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../out
          go build -trimpath -o ../out/dinah.exe ./cmd/dinah
          go build -trimpath -tags desktop,production -ldflags "-H windowsgui" -o ../out/dinah-desktop.exe ./cmd/dinah-desktop
          cd ../out && 7z a "../dinah-${{ matrix.name }}.zip" dinah.exe dinah-desktop.exe

      - name: Build for Linux
        if: matrix.goos == 'linux'
        run: |
          mkdir -p ../out
          CGO_ENABLED=0 go build -trimpath -o ../out/dinah ./cmd/dinah
          CGO_ENABLED=1 go build -trimpath -tags desktop,production,webkit2_41 -o ../out/dinah-desktop ./cmd/dinah-desktop
          tar -C ../out -czf "../dinah-${{ matrix.name }}.tar.gz" dinah dinah-desktop

      - name: Build for macOS
        if: matrix.goos == 'darwin'
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          PLATFORM=darwin/universal sh tools/macos-build/build-macos.sh
          mkdir -p ../out
          CGO_ENABLED=0 GOARCH=arm64 go build -trimpath -o ../out/dinah-arm64 ./cmd/dinah
          CGO_ENABLED=0 GOARCH=amd64 go build -trimpath -o ../out/dinah-amd64 ./cmd/dinah
          lipo -create -output ../out/dinah ../out/dinah-arm64 ../out/dinah-amd64
          rm ../out/dinah-arm64 ../out/dinah-amd64
          ditto cmd/dinah-desktop/build/bin/Dinah.app ../out/Dinah.app
          cd ../out && ditto -c -k --keepParent Dinah.app "../dinah-${{ matrix.name }}.zip" && zip -j "../dinah-${{ matrix.name }}.zip" dinah

      - uses: actions/upload-artifact@v4
        with:
          name: dinah-${{ matrix.name }}
          path: dinah-${{ matrix.name }}.*
          if-no-files-found: error

  publish:
    name: Publish the latest build
    # Only a push to master (or a run started by hand on master) publishes, and
    # only when every verify, browser and build job passed.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [verify, browser, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dinah-*
          merge-multiple: true
      - name: Replace the latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat > notes.md <<EOF
          The newest build of master, from commit ${GITHUB_SHA}. It is replaced on every push, and it is not a release.

          Each archive holds the command line, \`dinah\`, and the window, \`dinah-desktop\` (Dinah.app on macOS). Put them in \`~/.dinah/bin\` (\`%USERPROFILE%\\.dinah\\bin\` on Windows); on macOS, Dinah.app can go in Applications.

          Linux needs GTK 3 and WebKitGTK 4.1: on Debian 12 or Ubuntu 22.04 and later, \`sudo apt install libgtk-3-0 libwebkit2gtk-4.1-0\`.

          The macOS app is signed ad hoc, not by Apple, so macOS refuses to open it after a download until its quarantine mark is removed: \`xattr -dr com.apple.quarantine Dinah.app\`.

          SHA256SUMS lists the checksum of each file.
          EOF
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest --target "$GITHUB_SHA" --prerelease --title "Latest build of master" --notes-file notes.md dinah-* SHA256SUMS
