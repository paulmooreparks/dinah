# The Go build, vet and test pass, in one place so that two workflows run the
# same checks rather than two copies of them that drift apart.
#
# ci.yml runs this on the commit a push or a pull request names. promote.yml
# runs it on a tree it has just assembled by cherry-pick, which is a
# combination nobody has built before and which therefore has to be checked in
# its own right rather than inheriting a green result from the dev build any of
# its commits came from.
#
# This is a composite action rather than a reusable workflow on purpose. A
# reusable workflow runs its own checkout, so it can only ever check a tree
# that already exists at a ref on the remote. The tree promote.yml assembles
# exists only in the job's own checkout and is deliberately not pushed until
# every check has passed, so a called workflow could not see it at all.

name: Go checks
description: Build, vet and test the Go module at the given path.

inputs:
  path:
    description: The directory holding go.mod, relative to the workspace.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: ${{ inputs.path }}/go.mod
    - name: Go version
      shell: bash
      working-directory: ${{ inputs.path }}
      run: go version
    - name: Build
      shell: bash
      working-directory: ${{ inputs.path }}
      run: go build ./...
    - name: Vet
      shell: bash
      working-directory: ${{ inputs.path }}
      run: go vet ./...
    # dinah-tui, the terminal UI's program, is cmd/dinah built with the tui
    # tag, and the files that tag adds are invisible to the untagged vet and
    # test, so both run again with it (dinah-603).
    - name: Vet the terminal UI
      shell: bash
      working-directory: ${{ inputs.path }}
      run: go vet -tags tui ./cmd/dinah/...
    # The timeout is stated rather than left to Go's ten-minute default,
    # because cmd/dinah runs its own suite a second time under a coverage
    # profile and therefore costs about twice what its tests cost. That is
    # roughly three minutes on a developer machine and close to ten on a
    # Windows runner, so the package has been finishing just inside the
    # default and a slow runner kills a build that is doing nothing wrong.
    # The number is a ceiling on a hang, not a budget for the suite.
    - name: Test
      shell: bash
      working-directory: ${{ inputs.path }}
      run: go test -count=1 -timeout 30m ./...
    # The tagged run repeats cmd/dinah's untagged tests as well as running the
    # terminal UI's own, since a build tag adds files and removes none. The
    # coverage sweep, which starts a second untagged run of the package, skips
    # itself here because the step above already ran it.
    - name: Test the terminal UI
      shell: bash
      working-directory: ${{ inputs.path }}
      run: go test -count=1 -timeout 30m -tags tui ./cmd/dinah/... ./internal/screen/...
